name: Publish NPM Package (filemangl)

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Upgrade npm for OIDC Trusted Publishing (>=11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build Library (ESM + CJS + CSS + TypeScript .d.ts)
        run: npm run build:lib

      - name: Verify Package Contents & CLI Doctor
        run: |
          npm run doctor
          npm run pack:check

      - name: Publish to NPM with Provenance
        env:
          NPM_TOKEN_SECRET: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN_SECRET" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN_SECRET"
          fi
          npm publish --provenance --access public
